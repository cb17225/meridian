# Runs on every push and pull request to main.
# Two jobs: lint (fast, catches style issues) and test (verifies pipeline runs).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    # Linting runs first because it's fast (~5 seconds).
    # If your code has syntax errors or style issues, you want to
    # know immediately — no point running expensive tests on broken code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

  test:
    # Smoke test: verifies the training pipeline runs end-to-end.
    # Uses a small data subset so it finishes in seconds, not minutes.
    # This catches import errors, breaking API changes in dependencies,
    # and logic bugs — but not model quality (that's offline evaluation).
    runs-on: ubuntu-latest
    needs: lint  # only run if linting passes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke test
        run: python -m pytest tests/ -v
